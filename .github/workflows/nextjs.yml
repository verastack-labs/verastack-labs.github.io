name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # Gated until launch (phase 7 sets the DEPLOY_ENABLED repo variable), so a half-built site is
  # never public. Pull requests only build.
  deploy:
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
